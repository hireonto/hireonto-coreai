# Copy to deploy/gcp/api.env.yaml (git-ignored). Non-secret settings for ai-api on Cloud Run.
# Secrets (JWT_INTERNAL_SECRET, S3 keys, LLM/LiveKit/speech keys) come from Secret Manager, see secrets.sh.
APP_ENV: production
BACKEND_URL: https://backend.example.com
S3_ENDPOINT: https://<cloudflare-account-id>.r2.cloudflarestorage.com
S3_BUCKET: hiremind
S3_REGION: auto
LLM_PROVIDER: gemini
LLM_FALLBACKS: groq,claude
STT_PROVIDER: groq
TTS_PROVIDER: cartesia
LIVEKIT_URL: wss://your-project.livekit.cloud
AGENT_NAME: hiremind-interviewer
