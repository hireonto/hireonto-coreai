[project]
name = "hiremind-ai"
version = "0.1.0"
description = "HireMind AI: resume parsing, fit scoring, evaluation and the LiveKit voice interviewer"
readme = "README.md"
authors = [
    { name = "shivamsharma", email = "shivam.w2c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "livekit-agents[anthropic,cartesia,google,groq,openai,silero,turn-detector]>=1.8.9",
    "livekit-api>=1.2.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
